<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba Tickets Bodega</title>
<style>
  :root{
    --bg:#f4f2ee; --card:#ffffff; --tx:#1d1b18; --mut:#6b665e; --line:#e2ddd4;
    --acc:#9b2c1f; --ok:#1f7a4a; --err:#b42318; --code:#f7f5f1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151413; --card:#1f1d1b; --tx:#f1ede6; --mut:#a59e93; --line:#33302c;
           --acc:#e07a5f; --ok:#5cc28d; --err:#f2877c; --code:#181716; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 20px;font-size:14px}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  h2{font-size:17px;margin:0 0 10px}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--code);color:var(--tx);font:15px ui-monospace,Consolas,monospace}
  textarea{min-height:170px;resize:vertical}
  input.grande{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
  button{margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  .msg{margin-top:12px;font-size:14px;white-space:pre-wrap}
  .ok{color:var(--ok)} .err{color:var(--err)}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--mut);margin-top:6px}
  .meta b{color:var(--tx)}
  .qr{display:inline-block;margin-top:10px;padding:6px 10px;border:1px dashed var(--acc);border-radius:6px;font:600 18px ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<main>
  <h1>Prueba · Tickets de Bodega</h1>
  <p class="sub">Paso 1 simula al otro sistema mandando un ticket. Paso 2 simula tu escáner leyendo el QR corto.</p>

  <section>
    <h2>1 · Mandar un ticket (como lo haría el otro sistema)</h2>
    <label for="clave">Clave BODEGA_API_KEY (la que guardaste en Supabase)</label>
    <input id="clave" type="password" autocomplete="off" placeholder="tu clave secreta">
    <label for="json">Datos del ticket (JSON)</label>
    <textarea id="json">{
  "folio": "PRUEBA-0001",
  "cliente": "Mostrador",
  "items": [
    { "producto": "Pata morena", "kg": 15 },
    { "producto": "Corazón", "kg": 12 }
  ]
}</textarea>
    <button id="btnEnviar">Enviar ticket</button>
    <div id="msgEnviar" class="msg"></div>
  </section>

  <section>
    <h2>2 · Escanear el QR</h2>
    <label for="qr">Escanea o escribe el contenido del QR y presiona Enter</label>
    <input id="qr" class="grande" placeholder="TB:PRUEBA1" autocomplete="off">
    <button id="btnLeer">Buscar</button>
    <div id="msgLeer" class="msg"></div>
    <div id="ticket"></div>
  </section>
</main>

<script>
const URL_BASE = "https://eqynjddcosvdqjzztznn.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxeW5qZGRjb3N2ZHFqenp0em5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYxMzYwMzIsImV4cCI6MjA3MTcxMjAzMn0.Q51wsGelUvxRfqsMYRY5JduCGyZ7s6AzOhqsRf3kOhk";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const n = (v, d) => v == null ? "—" : Number(v).toLocaleString("es-MX", { minimumFractionDigits: d, maximumFractionDigits: d });

function msg(el, texto, tipo){ el.className = "msg " + (tipo || ""); el.textContent = texto; }

// ---------- Paso 1: enviar ----------
$("btnEnviar").onclick = async () => {
  const m = $("msgEnviar");
  let datos;
  try { datos = JSON.parse($("json").value); }
  catch { return msg(m, "El JSON tiene un error de formato.", "err"); }
  if (!$("clave").value.trim()) return msg(m, "Escribe la clave primero.", "err");

  $("btnEnviar").disabled = true; msg(m, "Enviando…");
  try {
    const r = await fetch(`${URL_BASE}/functions/v1/ticket-bodega`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": $("clave").value.trim() },
      body: JSON.stringify(datos)
    });
    const res = await r.json().catch(() => ({}));
    if (!r.ok || !res.ok) {
      msg(m, `Error ${r.status}: ${res.error || "sin detalle"}`, "err");
    } else {
      m.className = "msg ok";
      m.innerHTML = `Guardado${res.duplicado ? " (ya existía ese folio, se actualizó)" : ""}. Esto es lo que debe ir en el QR:<br><span class="qr">${esc(res.qr)}</span>`;
      $("qr").value = res.qr;
    }
  } catch (e) {
    msg(m, "No se pudo conectar: " + e.message, "err");
  } finally { $("btnEnviar").disabled = false; }
};

// ---------- Paso 2: leer ----------
async function leer(){
  const texto = $("qr").value.trim();
  const m = $("msgLeer"); $("ticket").innerHTML = "";
  if (!/^TB:[A-Z0-9-]{3,32}$/i.test(texto)) return msg(m, "Ese QR no es del formato nuevo (debe empezar con TB:).", "err");

  $("btnLeer").disabled = true; msg(m, "Buscando…");
  try {
    const r = await fetch(`${URL_BASE}/rest/v1/rpc/obtener_ticket_bodega`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: ANON, Authorization: `Bearer ${ANON}` },
      body: JSON.stringify({ p_id: texto })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const t = await r.json();
    if (!t) return msg(m, `No existe el ticket ${texto.toUpperCase()}.`, "err");

    msg(m, "Ticket encontrado.", "ok");
    const filas = t.items.map(it => `<tr>
        <td>${esc(it.producto)}</td>
        <td class="n">${n(it.kg, 3)}</td>
        <td class="n">${it.piezas == null ? "—" : esc(it.piezas)}</td>
        <td class="n">${it.importe == null ? "—" : "$" + n(it.importe, 2)}</td></tr>`).join("");
    $("ticket").innerHTML = `
      <div class="meta">
        <span>ID <b>${esc(t.id)}</b></span>
        <span>Folio <b>${esc(t.folio_origen || "—")}</b></span>
        <span>Cliente <b>${esc(t.cliente || "—")}</b></span>
        <span>Fecha <b>${new Date(t.fecha).toLocaleString("es-MX")}</b></span>
      </div>
      <table>
        <thead><tr><th>Producto</th><th class="n">Kg</th><th class="n">Piezas</th><th class="n">Importe</th></tr></thead>
        <tbody>${filas}</tbody>
        <tfoot><tr><th>Total</th><th class="n">${n(t.total_kg, 3)}</th><th></th><th class="n">${t.total_importe == null ? "" : "$" + n(t.total_importe, 2)}</th></tr></tfoot>
      </table>`;
  } catch (e) {
    msg(m, "No se pudo consultar: " + e.message, "err");
  } finally { $("btnLeer").disabled = false; $("qr").select(); }
}
$("btnLeer").onclick = leer;
$("qr").addEventListener("keydown", e => { if (e.key === "Enter") leer(); });
$("qr").focus();
</script>
</body>
</html>
